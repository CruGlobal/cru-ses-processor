# The v2 build-once / promote pipeline (Lambda).
#
# Cadence: nightly-if-changed, the default cadence for v2 apps (D11). The
# scheduled run builds the tip of main once a day; the build's no-change guard
# reuses the existing candidate when main hasn't moved, and deploy-candidate
# no-ops when release-candidate already runs that digest — so a quiet night is a
# true end-to-end no-op. workflow_dispatch builds on demand with the same guard
# semantics: an already-built sha is reused rather than rebuilt, and a force
# redeploy is available on cru-deploy's Deploy Candidate (v2) dispatch.
#
# This app is STAGE-LESS (RcMode "verify"): its only event source is the
# production SES notification stream, so there is no stage environment to deploy
# a candidate to. deploy-candidate takes its verify-candidate-aws path instead —
# it pulls the candidate image by digest and runs the app's VerifyCommand inside
# it, and a clean exit is what marks the candidate promotable. Same ledger row,
# same Slack post, same promote afterwards; the gate is a bundle-load check
# rather than a running environment.
#
# The whole v2 fleet builds nightly at 05:00 UTC — midnight EST, 1am EDT. The
# clock time drifts an hour across DST, which is the deliberate wobble of a
# fixed-UTC cron and perfectly tolerable for a nightly. It is still one shared
# slot for the whole fleet, with no staggering. 05:00 UTC is off-peak on
# GitHub's scheduler, so dispatch lag is minimal — unlike 00:00 UTC, the
# busiest cron minute on GitHub, where runs routinely started many minutes
# late. Scheduled dispatch is still best-effort, so a few minutes of lateness
# is expected, not a failure.
#
# Pinned to the `pipeline-v2` branch of CruGlobal/.github (both the reusable
# workflow and the actions) and passes workflow-ref: pipeline-v2 so the actions
# the reusable workflow checks out match. Re-pin every `@pipeline-v2` reference
# and the workflow-ref input to `@v2` at release.
name: Pipeline v2

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  build:
    name: Build candidate
    uses: CruGlobal/.github/.github/workflows/build-candidate.yml@pipeline-v2
    # build-candidate's lambda job authenticates to AWS via OIDC (the app's
    # prod GitHubRole), so the caller must grant id-token: write — a reusable
    # workflow can only downgrade, never elevate, the caller's permissions.
    permissions:
      id-token: write
      contents: read
    with:
      workflow-ref: pipeline-v2
      type: lambda
    # BUILD-time secrets are repo secrets named BUILD_<NAME> (D2): inherit hands
    # them to the reusable workflow, which exports ONLY the BUILD_* keys into
    # the build environment (prefix stripped).
    secrets: inherit

  deploy-release-candidate:
    name: Deploy to release-candidate
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: CruGlobal/.github/actions/dispatch@pipeline-v2
        with:
          github-token: ${{ secrets.CRU_DEPLOY_GITHUB_TOKEN }}
          workflow: deploy-candidate.yml
          inputs-json: >-
            {"project-name": "${{ needs.build.outputs.project-name }}",
             "tag": "${{ needs.build.outputs.candidate }}"}
