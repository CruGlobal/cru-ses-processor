name: Conventional Commits

# The repo is squash-only, so the PR title becomes the squash commit subject.
# This validates the title is a valid Conventional Commit so the history stays
# machine-readable (and stays release-tooling-ready). Scope is optional (both
# `feat:` and `feat(handlers):` are fine); `deps` is allowed to match
# Dependabot's npm prefix (.github/dependabot.yml). "Validate PR Title" is a
# required check in the repo's branch ruleset.
#
# Deliberately carries NO branch filter, so it reports on every pull_request
# regardless of base branch.
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  semantic-pr:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            ci
            docs
            build
            deps
            perf
            refactor
            revert
            style
            test
