name: Node.js CI

# The `test` job is a REQUIRED status check in this repo's branch ruleset
# (managed in cru-terraform, not here) — don't rename the job without updating
# it there, and keep the pull_request filter matching the default branch or the
# check never reports and nothing can merge.
on:
  push:
    branches:
      - '*'
      - '!master'
  pull_request:
    branches:
      # `main` is the default branch. This said `master` until pipeline-v2
      # onboarding: the default branch moved years ago and the filter never
      # followed, so no PR into `main` ever triggered this workflow — the push
      # trigger above was the only thing running the suite.
      - 'main'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.tool-versions'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run test
